<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Web-based calculator with high precision decimal arithmetic">
  <title>Web Calculator - Precision Arithmetic</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/layout.css">
  
  <!-- Prefers reduced motion support -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="calculator-container" role="main">
    <div class="calculator" role="application" aria-label="Calculator">
      
      <!-- Display Section -->
      <div class="calculator__display-section">
        <div 
          id="calculator-display" 
          class="calculator__display"
          role="region"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Calculator display">
          0
        </div>
      </div>
      
      <!-- Button Grid -->
      <div class="calculator__buttons" role="group" aria-label="Calculator buttons">
        
        <!-- Row 1: Clear and Backspace -->
        <button 
          id="btn-clear" 
          class="calculator__button calculator__button--clear"
          aria-label="Clear">
          C
        </button>
        <button 
          id="btn-backspace" 
          class="calculator__button calculator__button--backspace"
          aria-label="Backspace">
          ⌫
        </button>
        <button 
          id="btn-divide" 
          class="calculator__button calculator__button--operator"
          data-operator="/"
          aria-label="Divide">
          ÷
        </button>
        
        <!-- Row 2: 7, 8, 9, × -->
        <button 
          id="btn-7" 
          class="calculator__button calculator__button--number"
          data-digit="7"
          aria-label="7">
          7
        </button>
        <button 
          id="btn-8" 
          class="calculator__button calculator__button--number"
          data-digit="8"
          aria-label="8">
          8
        </button>
        <button 
          id="btn-9" 
          class="calculator__button calculator__button--number"
          data-digit="9"
          aria-label="9">
          9
        </button>
        <button 
          id="btn-multiply" 
          class="calculator__button calculator__button--operator"
          data-operator="*"
          aria-label="Multiply">
          ×
        </button>
        
        <!-- Row 3: 4, 5, 6, − -->
        <button 
          id="btn-4" 
          class="calculator__button calculator__button--number"
          data-digit="4"
          aria-label="4">
          4
        </button>
        <button 
          id="btn-5" 
          class="calculator__button calculator__button--number"
          data-digit="5"
          aria-label="5">
          5
        </button>
        <button 
          id="btn-6" 
          class="calculator__button calculator__button--number"
          data-digit="6"
          aria-label="6">
          6
        </button>
        <button 
          id="btn-subtract" 
          class="calculator__button calculator__button--operator"
          data-operator="-"
          aria-label="Subtract">
          −
        </button>
        
        <!-- Row 4: 1, 2, 3, + -->
        <button 
          id="btn-1" 
          class="calculator__button calculator__button--number"
          data-digit="1"
          aria-label="1">
          1
        </button>
        <button 
          id="btn-2" 
          class="calculator__button calculator__button--number"
          data-digit="2"
          aria-label="2">
          2
        </button>
        <button 
          id="btn-3" 
          class="calculator__button calculator__button--number"
          data-digit="3"
          aria-label="3">
          3
        </button>
        <button 
          id="btn-add" 
          class="calculator__button calculator__button--operator"
          data-operator="+"
          aria-label="Add">
          +
        </button>
        
        <!-- Row 5: 0, ., = -->
        <button 
          id="btn-0" 
          class="calculator__button calculator__button--number calculator__button--zero"
          data-digit="0"
          aria-label="0">
          0
        </button>
        <button 
          id="btn-decimal" 
          class="calculator__button calculator__button--decimal"
          aria-label="Decimal point">
          .
        </button>
        <button 
          id="btn-equals" 
          class="calculator__button calculator__button--equals"
          aria-label="Equals">
          =
        </button>
      </div>
    </div>
  </main>
  
  <!-- JavaScript Module -->
  <script type="module" src="./main.js"></script>
</body>
</html>
